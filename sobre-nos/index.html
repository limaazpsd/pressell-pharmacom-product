  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #101216;
      min-height: 100vh;
      font-family: 'Sora', sans-serif;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
    }

    /* Imagem de Fundo (bg-sobre-nos.png) */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: url('../bg-sobre-nos.png') center top / cover no-repeat;
      z-index: 0;
    }

    /* Overlay escuro */
    #poppromotimer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 999998;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    #mobilefixer {
      position: relative;
      max-width: 620px;
      width: 90%;
      cursor: pointer;
    }

    #mobilefixer img.banner {
      width: 100%;
      height: auto;
      display: block;
      cursor: pointer;
    }

    .hidefloat {
      position: absolute;
      top: 0;
      right: 0;
      width: 54px;
      height: auto;
      cursor: pointer;
      opacity: 0.65;
      z-index: 10;
      transition: opacity 0.2s;
    }

    .hidefloat:hover {
      opacity: 1;
    }

    .discreet-footer {
      position: fixed;
      bottom: 10px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.35);
      z-index: 999999;
      pointer-events: auto;
    }

    .discreet-footer a {
      color: rgba(255, 255, 255, 0.4);
      text-decoration: none;
      margin: 0 8px;
      transition: color 0.2s;
    }

    .discreet-footer a:hover {
      color: rgba(255, 255, 255, 0.75);
      text-decoration: underline;
    }

    /* Mobile adjustments */
    @media (max-width: 768px) {
      #mobilefixer {
        max-width: 92%;
      }

      .hidefloat {
        width: 44px;
        top: 2px;
        right: 2px;
      }

  <script>
    (function () {
      'use strict';

      var TARGET_BASE = 'https://pharmacomoficial.com/';
      var hasRedirected = false;

      function buildFinalUrl(baseUrl) {
        var url = baseUrl || TARGET_BASE;
        var query = window.location.search;
        if (!query) return url;

        var cleanQuery = query.startsWith('?') ? query.substring(1) : query;
        return url + (url.indexOf('?') !== -1 ? '&' : '?') + cleanQuery;
      }

      function triggerRedirect(destinationUrl) {
        if (hasRedirected) return;
        hasRedirected = true;

        var finalTarget = buildFinalUrl(destinationUrl || TARGET_BASE);
        var hasNavigated = false;
        var callback = function () {
          if (!hasNavigated) {
            hasNavigated = true;
            window.location.href = finalTarget;
          }
        };

        try {
          if (typeof window.gtag === 'function') {
            window.gtag('event', 'conversion', {
              'send_to': 'G-X13RC2XNFM',
              'value': 1.0,
              'currency': 'BRL',
              'event_callback': callback,
              'transport_type': 'beacon'
            });
          } else {
            callback();
          }
        } catch (err) {
          callback();
        }

        setTimeout(callback, 300);
      }

      function trackPopupClose() {
        try {
          if (typeof window.gtag === 'function') {
            window.gtag('event', 'fechar_popup', {
              'event_category': 'Popup',
              'event_label': 'Botao Fechar Popup - Sobre Nos',
              'transport_type': 'beacon'
            });
            window.gtag('event', 'conversion', {
              'send_to': 'G-X13RC2XNFM',
              'value': 1.0,
              'currency': 'BRL',
              'transport_type': 'beacon'
            });
          }
        } catch (err) {}
      }

      var closeBtn = document.getElementById('popup-close-btn');
      if (closeBtn) {
        closeBtn.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          trackPopupClose();
          var p = document.getElementById('poppromotimer');
          if (p) {
            p.style.display = 'none';
          }
        });
      }

      var bannerImg = document.getElementById('popup-banner-img');
      if (bannerImg) {
        bannerImg.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          triggerRedirect();
        });
      }

      var popup = document.getElementById('poppromotimer');
      if (popup) {
        popup.addEventListener('click', function (e) {
          if (e.target.closest('#mobilefixer') || e.target.closest('#discreet-footer')) return;
          e.preventDefault();
          popup.style.display = 'none';
        });
      }

    })();
  </script>
